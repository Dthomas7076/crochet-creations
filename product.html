<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details | Crochet Creations</title>
    <style>
      :root {
        --sunset-orange: #f39a6b;
        --sunset-orange-deep: #e8774d;
        --blue: #5d8bb4;
        --blue-deep: #3d6d99;
        --beige: #f4e7d3;
        --beige-deep: #ddd0b8;
        --text-dark: #2d2a2a;
        --white: #ffffff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--beige) 0%, #f8f2ea 100%);
        color: var(--text-dark);
      }

      a { text-decoration: none; color: inherit; }

      .container {
        width: min(1100px, 90%);
        margin: 0 auto;
      }

      header {
        background: rgba(255, 255, 255, 0.45);
        border-bottom: 1px solid rgba(93, 139, 180, 0.2);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 0;
      }

      .logo {
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--blue-deep);
      }

      .nav-links {
        display: flex;
        gap: 24px;
        font-weight: 600;
      }

      .product-page {
        padding: 60px 0;
      }

      .product-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        align-items: center;
      }

      .product-image {
        width: 100%;
        height: 520px;
        object-fit: cover;
        border-radius: 28px;
        box-shadow: 0 20px 40px rgba(61, 109, 153, 0.18);
        background: linear-gradient(135deg, #fcd8c5 0%, #bfd7ea 100%);
      }

      .product-info h1 {
        margin: 0 0 16px;
        color: var(--blue-deep);
        font-size: clamp(2.4rem, 4vw, 4rem);
      }

      .price {
        font-size: 1.9rem;
        font-weight: 800;
        color: var(--sunset-orange-deep);
        margin-bottom: 16px;
      }

      .description {
        font-size: 1.05rem;
        line-height: 1.8;
        color: rgba(45, 42, 42, 0.75);
        margin-bottom: 22px;
      }

      .details-list {
        list-style: none;
        padding: 0;
        margin: 0 0 28px;
        display: grid;
        gap: 10px;
      }

      .details-list li {
        background: rgba(255,255,255,0.6);
        border: 1px solid rgba(93, 139, 180, 0.14);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .actions {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-block;
        border-radius: 999px;
        padding: 15px 24px;
        font-weight: 700;
      }

      .btn-primary {
        background: var(--blue);
        color: var(--white);
      }

      .btn-secondary {
        background: var(--sunset-orange);
        color: var(--white);
      }

      .floating-cart {
        position: fixed;
        right: 22px;
        bottom: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--sunset-orange), var(--sunset-orange-deep));
        color: var(--white);
        box-shadow: 0 18px 32px rgba(232, 119, 77, 0.28);
        text-decoration: none;
        z-index: 30;
        border: none;
        cursor: pointer;
      }

      .floating-cart-icon {
        font-size: 1.7rem;
        line-height: 1;
      }

      .floating-cart-count {
        position: absolute;
        top: -8px;
        right: -8px;
        min-width: 24px;
        height: 24px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--blue-deep);
        color: var(--white);
        display: grid;
        place-items: center;
        font-size: 0.75rem;
        font-weight: 800;
      }

      .floating-cart-panel {
        position: fixed;
        right: 22px;
        bottom: 98px;
        width: min(330px, calc(100vw - 28px));
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(93, 139, 180, 0.15);
        border-radius: 20px;
        box-shadow: 0 18px 32px rgba(61, 109, 153, 0.18);
        z-index: 31;
        padding: 18px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(12px);
        transition: all 0.2s ease;
      }

      .floating-cart-panel.visible {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .floating-cart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        color: var(--blue-deep);
        font-weight: 800;
      }

      .floating-cart-close {
        border: none;
        background: transparent;
        color: var(--blue-deep);
        font-size: 1.4rem;
        cursor: pointer;
        line-height: 1;
      }

      .floating-cart-item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(93, 139, 180, 0.1);
      }

      .floating-cart-item strong {
        color: var(--sunset-orange-deep);
      }

      .floating-cart-item small {
        display: block;
        color: rgba(45, 42, 42, 0.7);
      }

      .floating-cart-empty {
        color: rgba(45, 42, 42, 0.75);
        margin: 0;
      }

      .floating-cart-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
      }

      .floating-cart-total {
        font-weight: 800;
        color: var(--blue-deep);
      }

      .floating-cart-go {
        background: var(--sunset-orange);
        color: var(--white);
        border-radius: 999px;
        padding: 10px 14px;
        font-weight: 700;
        text-decoration: none;
      }

      footer {
        text-align: center;
        padding: 30px 0 50px;
        color: rgba(45, 42, 42, 0.75);
      }

      @media (max-width: 800px) {
        nav {
          flex-direction: column;
          gap: 16px;
        }

        .product-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <nav>
          <div class="logo">CROCHET CREATIONS</div>
          <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#shop">Shop</a>
            <a href="index.html#contact">Contact</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="container product-page">
      <div class="product-layout">
        <img id="product-image" class="product-image" src="" alt="Product image" />

        <div class="product-info">
          <h1 id="product-name">Product</h1>
          <div id="product-price" class="price">$0</div>
          <p id="product-description" class="description"></p>

          <ul class="details-list">
            <li>Handmade with care</li>
            <li>Custom colors available</li>
            <li>Gift-ready packaging</li>
          </ul>

          <div class="actions">
            <a class="btn btn-primary" href="cart.html" id="add-to-cart-link">Add to cart</a>
            <a class="btn btn-secondary" href="shop.html">Back to Shop</a>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="container">© 2026 Crochet Creations • Handmade with heart</div>
    </footer>

    <div class="floating-cart-panel" id="floating-cart-panel">
      <div class="floating-cart-header">
        <span>Your cart</span>
        <button type="button" class="floating-cart-close" id="close-cart-panel" aria-label="Close cart">×</button>
      </div>
      <div id="floating-cart-items"></div>
      <div class="floating-cart-footer">
        <span class="floating-cart-total" id="floating-cart-total">$0</span>
        <a href="cart.html" class="floating-cart-go">View cart</a>
      </div>
    </div>

    <button type="button" class="floating-cart" id="floating-cart-trigger" aria-label="Cart">
      <span class="floating-cart-icon">🛒</span>
      <span class="floating-cart-count" id="floating-cart-count">0</span>
    </button>

    <script>
      function getCart() {
        try {
          return JSON.parse(localStorage.getItem('crochetCart')) || [];
        } catch (error) {
          return [];
        }
      }

      function updateFloatingCartCount() {
        const cart = getCart();
        const total = cart.reduce((sum, item) => sum + item.quantity, 0);
        const badge = document.getElementById('floating-cart-count');
        const panelItems = document.getElementById('floating-cart-items');
        const panelTotal = document.getElementById('floating-cart-total');

        if (badge) badge.textContent = total;

        if (!panelItems || !panelTotal) return;

        if (!cart.length) {
          panelItems.innerHTML = '<p class="floating-cart-empty">Your cart is empty.</p>';
          panelTotal.textContent = '$0';
          return;
        }

        const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        panelItems.innerHTML = cart.map(item => `
          <div class="floating-cart-item">
            <div>
              <div>${item.name}</div>
              <small>Qty: ${item.quantity}</small>
            </div>
            <strong>$${item.price * item.quantity}</strong>
          </div>
        `).join('');
        panelTotal.textContent = `$${subtotal}`;
      }

      const products = {
        'handmade-animals': {
          name: 'Handmade Animals',
          price: '$28',
          description: 'Cute and cozy crocheted pandas created with soft yarn and delightful personality.',
          image: 'https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=900&q=80'
        },
        'snowflake-coasters': {
          name: 'Snowflake Coasters',
          price: '$18',
          description: 'Delicate crocheted snowflake coasters that bring a touch of winter charm to your home.',
          image: 'https://images.unsplash.com/photo-1517486800579-88f7d53d9f1c?auto=format&fit=crop&w=900&q=80'
        },
        'handmade-bible-bags': {
          name: 'Handmade Bible Bags',
          price: '$35',
          description: 'A beautifully crafted crocheted handbag designed for daily use with a handmade personal touch.',
          image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80'
        }
      };

      const params = new URLSearchParams(window.location.search);
      const productKey = params.get('product');
      const selectedProduct = products[productKey] || products['handmade-animals'];

      const productData = {
        id: productKey,
        name: selectedProduct.name,
        price: Number(selectedProduct.price.replace(/[$,]/g, '')),
        image: selectedProduct.image,
        quantity: 1
      };

      document.getElementById('product-name').textContent = selectedProduct.name;
      document.getElementById('product-price').textContent = selectedProduct.price;
      document.getElementById('product-description').textContent = selectedProduct.description;
      document.getElementById('product-image').src = selectedProduct.image;
      document.getElementById('product-image').alt = selectedProduct.name;

      document.getElementById('add-to-cart-link').addEventListener('click', event => {
        event.preventDefault();

        const cart = JSON.parse(localStorage.getItem('crochetCart') || '[]');
        const existingItem = cart.find(item => item.id === productData.id);

        if (existingItem) {
          existingItem.quantity += 1;
        } else {
          cart.push(productData);
        }

        localStorage.setItem('crochetCart', JSON.stringify(cart));
        updateFloatingCartCount();
        const floatingCartPanel = document.getElementById('floating-cart-panel');
        if (floatingCartPanel) floatingCartPanel.classList.add('visible');
      });

      const floatingCartTrigger = document.getElementById('floating-cart-trigger');
      const floatingCartPanel = document.getElementById('floating-cart-panel');
      const closeCartPanel = document.getElementById('close-cart-panel');

      floatingCartTrigger.addEventListener('click', () => {
        floatingCartPanel.classList.toggle('visible');
      });

      closeCartPanel.addEventListener('click', () => {
        floatingCartPanel.classList.remove('visible');
      });

      document.addEventListener('click', event => {
        if (!floatingCartPanel.contains(event.target) && !floatingCartTrigger.contains(event.target)) {
          floatingCartPanel.classList.remove('visible');
        }
      });

      updateFloatingCartCount();
    </script>
  </body>
</html>
